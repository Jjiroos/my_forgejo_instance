services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:11
    container_name: forgejo
    restart: unless-stopped
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - TZ=Europe/Paris
      - FORGEJO__database__DB_TYPE=postgres
      - FORGEJO__database__HOST=db:5432
      - FORGEJO__database__NAME=${POSTGRES_DB}
      - FORGEJO__database__USER=${POSTGRES_USER}
      - FORGEJO__database__PASSWD=${POSTGRES_PASSWORD}
      - FORGEJO__server__ROOT_URL=https://${FORGEJO_DOMAIN}:8181/
      - FORGEJO__server__HTTP_PORT=3000
      - FORGEJO__server__START_SSH_SERVER=false
      - FORGEJO__server__DISABLE_SSH=true
      - FORGEJO__log__MODE=console,file
      - FORGEJO__log__LEVEL=info
      # ── Forgejo Actions (runners k3s — voir SETUP-K3S.md) ──
      - FORGEJO__actions__ENABLED=true
      - FORGEJO__actions__DEFAULT_ACTIONS_URL=https://code.forgejo.org
      # ── Mail : réinitialisation du mot de passe (voir SETUP.md §10.6) ──
      # Relais Gmail : un envoi direct depuis une IP résidentielle finit en spam.
      - FORGEJO__mailer__ENABLED=true
      - FORGEJO__mailer__PROTOCOL=smtps
      - FORGEJO__mailer__SMTP_ADDR=smtp.gmail.com
      - FORGEJO__mailer__SMTP_PORT=465
      - FORGEJO__mailer__USER=sc0vil.forge@gmail.com
      - FORGEJO__mailer__PASSWD=${FORGEJO_MAILER_PASSWORD}
      - FORGEJO__mailer__FROM=sc0vil forge <sc0vil.forge@gmail.com>
      # ── Connexion : session longue, Google à la place d'OpenID 2.0 ──
      - FORGEJO__security__LOGIN_REMEMBER_DAYS=30
      - FORGEJO__openid__ENABLE_OPENID_SIGNIN=false
      - FORGEJO__openid__ENABLE_OPENID_SIGNUP=false
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - forgejo-net

  db:
    image: postgres:16-alpine
    container_name: forgejo-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - forgejo-net

networks:
  forgejo-net:
