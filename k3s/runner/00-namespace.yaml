# Namespace de la CI + garde-fous de ressources.
#
# Le ResourceQuota est la protection dure du serveur : quoi qu'il arrive dans un
# workflow, la CI ne peut pas dépasser ce budget et ne peut donc pas faire tomber
# Forgejo, PostgreSQL ou les autres services de la machine.
# Dimensionné pour 1 runner / 2 jobs simultanés (voir SETUP-K3S.md pour scaler).
apiVersion: v1
kind: Namespace
metadata:
  name: forgejo-actions
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ci-budget
  namespace: forgejo-actions
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 768Mi
    limits.cpu: "4"
    limits.memory: 3Gi             # plafond RAM de TOUTE la CI
    pods: "4"
    persistentvolumeclaims: "6"
---
# Valeurs par défaut : tout conteneur sans resources explicites reste borné.
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: forgejo-actions
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 256Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
---
# Aucun pod du cluster ne doit pouvoir joindre le démon Docker du runner.
# dockerd-entrypoint.sh ouvre systématiquement tcp://0.0.0.0:2375 quand TLS est
# désactivé : on ne peut pas le lui retirer, on ferme donc l'entrée côté réseau.
# Le runner n'a besoin d'aucun trafic entrant (il interroge Forgejo en sortant),
# et les conteneurs de job vivent dans le réseau interne de dind, non concerné.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: forgejo-actions
spec:
  podSelector: {}
  policyTypes:
    - Ingress
