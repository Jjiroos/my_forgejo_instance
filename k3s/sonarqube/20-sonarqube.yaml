# Serveur SonarQube Community (image arm64 officielle).
#
# Exposition : hostPort 9000 lié à l'IP LAN du nœud. SonarQube n'est donc
# joignable que depuis le réseau local — ni depuis Internet (rien n'est ajouté
# au port-forward de la box), ni depuis les autres pods. C'est cette même
# adresse que les conteneurs de job utilisent comme SONAR_HOST_URL.
#
# ⚠️ Prérequis hôte : vm.max_map_count=524288 (cf. SETUP-SONARQUBE.md §2).
#    Sans lui, Elasticsearch refuse de démarrer et le pod boucle.
#
# ${NODE_LAN_IP} est substitué depuis .env par k3s/apply.sh.
apiVersion: v1
kind: Service
metadata:
  name: sonarqube
  namespace: sonarqube
spec:
  selector:
    app: sonarqube
  ports:
    - name: http
      port: 9000
      targetPort: 9000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sonarqube
  namespace: sonarqube
spec:
  serviceName: sonarqube
  # 0 : SonarQube dort par défaut. La CI le réveille (examples/sonar/sonar-wake.sh)
  # et le CronJob de 40-veille.yaml le rendort après 30 min sans activité.
  # Réappliquer ce manifeste éteint donc un serveur allumé.
  replicas: 0
  selector:
    matchLabels:
      app: sonarqube
  template:
    metadata:
      labels:
        app: sonarqube
    spec:
      securityContext:
        # L'image tourne en uid 1000 ; les volumes local-path sont créés
        # root:root. Sans fsGroup, SonarQube ne peut pas écrire dans /data.
        fsGroup: 1000

      initContainers:
        # SonarQube échoue définitivement si la base n'est pas là au démarrage :
        # on attend plutôt que de subir un CrashLoopBackOff.
        - name: wait-for-db
          image: postgres:16-alpine
          command: ["sh", "-ec"]
          args:
            - |
              until pg_isready -h sonarqube-db -U sonarqube -d sonarqube; do
                echo "attente de PostgreSQL…"
                sleep 3
              done

      containers:
        - name: sonarqube
          image: sonarqube:community
          env:
            - name: SONAR_JDBC_URL
              value: jdbc:postgresql://sonarqube-db:5432/sonarqube
            - name: SONAR_JDBC_USERNAME
              value: sonarqube
            - name: SONAR_JDBC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sonarqube-db
                  key: password
            # Sans bornes explicites, chaque JVM se dimensionne sur la RAM de la
            # machine et dépasse la limite du conteneur → OOM kill immédiat.
            - name: SONAR_WEB_JAVAOPTS
              value: "-Xmx512m -Xms128m"
            - name: SONAR_CE_JAVAOPTS
              value: "-Xmx512m -Xms128m"
            - name: SONAR_SEARCH_JAVAOPTS
              value: "-Xmx512m -Xms512m"      # Elasticsearch impose Xms = Xmx
          ports:
            - name: http
              containerPort: 9000
              hostPort: 9000
              hostIP: "${NODE_LAN_IP}"        # LAN uniquement, jamais 0.0.0.0
          startupProbe:
            httpGet:
              path: /api/system/status
              port: 9000
            periodSeconds: 10
            failureThreshold: 60              # 10 min : premier démarrage lent sur ARM
          readinessProbe:
            httpGet:
              path: /api/system/status
              port: 9000
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /opt/sonarqube/data
            - name: extensions
              mountPath: /opt/sonarqube/extensions
            - name: logs
              mountPath: /opt/sonarqube/logs
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2560Mi

      volumes:
        - name: logs                          # non persisté : kubectl logs suffit
          emptyDir: {}

  volumeClaimTemplates:
    - metadata:
        name: data                            # index Elasticsearch + état
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
    - metadata:
        name: extensions                      # plugins
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
