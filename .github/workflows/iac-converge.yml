---
# Déploiement réel du playbook sur une machine jetable, sur les deux
# architectures cibles. Un runner GitHub est une VM neuve à chaque exécution :
# c'est exactement le scénario « reprise après panne » que ce dépôt prétend
# couvrir, et le seul moyen honnête de le prouver.
#
# Rien ici ne touche une machine réelle. La cible est le runner lui-même
# (`ansible_connection: local`), avec l'inventaire inventory/ci.yml et des
# valeurs volontairement fictives : domaine en .invalid, tout en loopback,
# certificat auto-signé. Aucun secret, aucun jeton, aucun compte tiers.
name: IaC — convergence

on:
  push:
    branches: [main]
    paths:
      - 'ansible/**'
      - '.github/workflows/iac-converge.yml'
  pull_request:
    paths:
      - 'ansible/**'
      - '.github/workflows/iac-converge.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  converge:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # Une architecture qui échoue ne doit pas masquer le résultat de l'autre :
      # savoir que ça passe sur arm64 et pas sur amd64 est l'information utile.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            profile: generic_amd64
          # arm64 est l'architecture de la cible réelle (Raspberry Pi 5). Un
          # runner arm64 n'est pas un Pi — d'où generic_arm64 et non
          # raspberry_pi : l'architecture est la même, l'amorçage non.
          - arch: arm64
            runner: ubuntu-24.04-arm
            profile: generic_arm64

    env:
      CI_HOST_PROFILE: ${{ matrix.profile }}

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Préparer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer Ansible
        run: pip install --disable-pip-version-check ansible-core

      - name: Installer les collections
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Contexte d'exécution
        run: |
          echo "architecture : $(uname -m)"
          grep '^PRETTY_NAME' /etc/os-release
          ansible --version | head -1

      # ── Premier passage : la machine part de zéro ─────────────
      #
      # Le nom de la tâche en échec est émis en annotation, pas seulement dans
      # le journal : une annotation se lit sans authentification, un journal de
      # job non. Sur un dépôt public, c'est la différence entre un échec qu'on
      # diagnostique de l'extérieur et un échec qu'il faut aller déterrer.
      - name: Convergence
        working-directory: ansible
        run: |
          set +e
          ansible-playbook -i inventory/ci.yml site.yml --diff 2>&1 | tee /tmp/passe1.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            awk '/^TASK \[/{t=$0} /^fatal:|^failed:/{print "::error::Tâche en échec — " t; print "::error::" substr($0,1,500); exit}' /tmp/passe1.log
            echo "::error::Premier passage en échec (code ${rc})."
            exit "$rc"
          fi

      # ── Second passage : il ne doit plus rien rester à faire ──
      #
      # C'est le vrai test. Un playbook qui « marche » mais rejoue les mêmes
      # modifications à chaque exécution n'est pas de l'infrastructure comme
      # code : c'est un script shell déguisé, impossible à relancer sans
      # crainte sur une machine en production.
      #
      # Deux issues distinctes, à ne surtout pas confondre : le playbook peut
      # échouer, ou réussir en modifiant à nouveau quelque chose. La première
      # version confondait les deux — `set -e` coupait sur l'échec avant que le
      # message n'ait pu être écrit, et il ne restait qu'un « exit code 2 ».
      - name: Idempotence
        working-directory: ansible
        run: |
          set +e
          ansible-playbook -i inventory/ci.yml site.yml --diff 2>&1 | tee /tmp/passe2.log
          rc=${PIPESTATUS[0]}
          set -e

          if [ "$rc" -ne 0 ]; then
            awk '/^TASK \[/{t=$0} /^fatal:|^failed:/{print "::error::Tâche en échec — " t; print "::error::" substr($0,1,500); exit}' /tmp/passe2.log
            echo "::error::Le second passage a échoué (code ${rc}) : ce n'est pas un défaut d'idempotence, c'est une tâche en erreur."
            exit "$rc"
          fi

          recap=$(grep -E '^ci-runner +:' /tmp/passe2.log || true)
          if [ -z "$recap" ]; then
            echo "::error::Récapitulatif introuvable — le format de sortie a changé ?"
            exit 1
          fi
          echo "$recap"
          modifs=$(echo "$recap" | sed -n 's/.*changed=\([0-9]\+\).*/\1/p')
          if [ "$modifs" != "0" ]; then
            echo "::error::Le second passage a modifié ${modifs} chose(s) : une tâche n'est pas idempotente."
            awk '/^TASK \[/{t=$0} /^changed:/{print "::error::Tâche non idempotente — " t}' /tmp/passe2.log | sort -u | head -8
            exit 1
          fi
          echo "Second passage sans modification."

      # ── Ce que le playbook a réellement produit ───────────────
      #
      # `changed=0` prouve la convergence, pas le résultat. Ces contrôles
      # regardent la machine, pas le rapport d'Ansible.
      - name: Vérifier le réglage noyau
        run: |
          valeur=$(sysctl -n vm.max_map_count)
          echo "vm.max_map_count = ${valeur}"
          test "${valeur}" = "524288"
          test -f /etc/sysctl.d/99-sonarqube.conf

      - name: Vérifier le certificat auto-signé
        run: |
          sudo test -f /etc/nginx/ssl/forgejo.crt
          sudo openssl x509 -in /etc/nginx/ssl/forgejo.crt -noout -subject -dates -ext subjectAltName

      - name: Vérifier la configuration nginx
        run: |
          sudo nginx -t
          echo "--- vhosts activés"
          ls -l /etc/nginx/sites-enabled/
          test ! -e /etc/nginx/sites-enabled/default
          echo "--- ports en écoute"
          sudo ss -lntp | grep -E ':8181|:9443'

      # Deux réponses attendues, et leur différence est le contrôle.
      #
      # La forge est déployée par ce playbook : son vhost doit répondre 200 sur
      # /api/healthz, ce qui prouve d'un coup la terminaison TLS, le relais, et
      # une application réellement démarrée derrière.
      #
      # SonarQube ne l'est pas : son vhost doit répondre 502. Un 502 n'est pas
      # un échec ici, c'est la preuve que nginx relaie vers un amont absent —
      # obtenir autre chose signifierait que le vhost ne fait pas ce qu'il dit.
      - name: Vérifier que nginx relaie
        run: |
          # -k : le certificat est auto-signé en CI, et il porte de toute façon
          # forge.ci.invalid, pas 127.0.0.1.
          code=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 15 https://127.0.0.1:8181/api/healthz || echo échec)
          echo "forgejo (8181, TLS) /api/healthz : ${code}"
          test "${code}" = "200"

          code=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 10 https://127.0.0.1:9443/ || echo échec)
          echo "sonarqube (9443, TLS) : ${code}"
          test "${code}" = "502"

      - name: Vérifier la pile Forgejo
        run: |
          echo "--- conteneurs"
          sudo docker compose -f /srv/forgejo/docker-compose.yml ps
          for c in forgejo forgejo-db; do
            etat=$(sudo docker inspect -f '{{.State.Status}}' "$c")
            echo "${c} : ${etat}"
            test "${etat}" = "running"
          done

          echo "--- santé applicative"
          sudo curl -sS --max-time 15 http://127.0.0.1:3000/api/healthz | tee /tmp/healthz.json
          grep -q '"status"' /tmp/healthz.json

          echo "--- compte d'administration créé sans passer par l'assistant web"
          sudo docker exec -u git forgejo forgejo admin user list --admin | grep -q ci-admin

          echo "--- le port applicatif n'est joignable qu'en loopback"
          sudo ss -lntp | grep -E '127\.0\.0\.1:3000'
          ! sudo ss -lntp | grep -E '0\.0\.0\.0:3000'

          echo "--- le fichier d'environnement n'est lisible que par root"
          droits=$(sudo stat -c '%a %U' /srv/forgejo/.env)
          echo "/srv/forgejo/.env : ${droits}"
          test "${droits}" = "600 root"
          # Le compose est en 0644 : aucune valeur sensible ne doit y figurer.
          ! grep -q 'jetable-de-CI' /srv/forgejo/docker-compose.yml

      # Le vrai test d'une jail n'est pas qu'elle soit « active ». C'est
      # qu'elle compte. Une authentification refusée est émise pour de bon, à
      # travers nginx, puis on vérifie que fail2ban l'a vue — le contrôle qui
      # aurait attrapé le défaut de la jail sshd des années plus tôt.
      - name: Vérifier que la jail Forgejo compte réellement
        run: |
          sudo fail2ban-client status forgejo

          curl -sk -o /dev/null --max-time 15 \
            -u "utilisateur-inexistant:mot-de-passe-faux" \
            https://127.0.0.1:8181/api/v1/user || true

          for _ in $(seq 1 30); do
            comptes=$(sudo fail2ban-client status forgejo | sed -n 's/.*Total failed:[[:space:]]*\([0-9]\+\).*/\1/p')
            [ "${comptes:-0}" -ge 1 ] && break
            sleep 3
          done

          sudo fail2ban-client status forgejo
          if [ "${comptes:-0}" -lt 1 ]; then
            echo "::error::La jail forgejo n'a compté aucun échec après une authentification refusée."
            echo "--- ce que la forge a journalisé"
            sudo tail -n 30 /srv/forgejo/data/gitea/log/gitea.log || true
            echo "--- ce que le filtre reconnaît"
            sudo fail2ban-regex /srv/forgejo/data/gitea/log/gitea.log \
              /etc/fail2ban/filter.d/forgejo.conf || true
            exit 1
          fi
          echo "Jail forgejo : ${comptes} échec(s) comptabilisé(s)."

      - name: Vérifier le pare-feu
        run: |
          sudo ufw status verbose
          sudo ufw status | grep -q '8181/tcp'
          sudo ufw status | grep -q '9443/tcp'
          # Le pare-feu ne doit pas avoir coupé la machine du monde : la
          # politique sortante reste `allow`, et la CI en dépend.
          curl -sS -o /dev/null --max-time 15 https://api.github.com/

      - name: Vérifier fail2ban
        run: |
          sudo systemctl is-active fail2ban
          sudo fail2ban-client status
          sudo fail2ban-client status sshd
          # Une jail active n'est pas une jail qui surveille quelque chose : le
          # filtre fourni par fail2ban vise `sshd.service`, que Debian et Ubuntu
          # appellent `ssh.service`. Sans ce réglage, la jail compte zéro échec
          # quoi qu'il arrive.
          sudo fail2ban-client get sshd journalmatch | grep -q 'ssh.service'

      # ── Diagnostic ────────────────────────────────────────────
      - name: Rassembler de quoi comprendre un échec
        if: failure()
        run: |
          echo "::group::nginx -t"
          sudo nginx -t || true
          echo "::endgroup::"
          echo "::group::journal nginx"
          sudo journalctl -u nginx --no-pager -n 60 || true
          echo "::endgroup::"
          echo "::group::journal fail2ban"
          sudo journalctl -u fail2ban --no-pager -n 60 || true
          echo "::endgroup::"
          echo "::group::vhosts générés"
          sudo tail -n +1 /etc/nginx/sites-available/* /etc/nginx/conf.d/*.conf || true
          echo "::endgroup::"
          echo "::group::ufw"
          sudo ufw status numbered || true
          echo "::endgroup::"
          echo "::group::ports"
          sudo ss -lntp || true
          echo "::endgroup::"
          echo "::group::conteneurs"
          sudo docker compose -f /srv/forgejo/docker-compose.yml ps -a || true
          sudo docker compose -f /srv/forgejo/docker-compose.yml logs --tail 80 || true
          echo "::endgroup::"
          echo "::group::journal de la forge"
          sudo tail -n 80 /srv/forgejo/data/gitea/log/gitea.log || true
          echo "::endgroup::"
          echo "::group::jails fail2ban"
          sudo fail2ban-client status || true
          sudo fail2ban-client status forgejo || true
          echo "::endgroup::"
