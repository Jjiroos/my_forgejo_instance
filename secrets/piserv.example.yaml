# Gabarit des secrets. Ce fichier-ci est versionné parce qu'il ne contient
# aucune valeur — il ne sert qu'à documenter la forme attendue.
#
# Le fichier réel n'est JAMAIS versionné, chiffré ou non (cf. .gitignore) :
#
#   cp secrets/piserv.example.yaml secrets/piserv.sops.yaml
#   sops -e -i secrets/piserv.sops.yaml     # chiffre sur place
#   sops secrets/piserv.sops.yaml           # édite en clair dans $EDITOR
#
# Le chiffrement SOPS protège le fichier au repos sur la machine et permet de
# le sauvegarder ailleurs sans exposer les valeurs. Il ne l'autorise pas pour
# autant à entrer dans un dépôt public.
forgejo:
  postgres_password: ""
  admin_username: ""
  admin_password: ""
  admin_email: ""
  admin_api_token: ""
  # Non exposé par le provider Forgejo : à produire par l'API puis coller ici.
  runner_registration_token: ""

  # Clés applicatives. À laisser vides pour une installation neuve : Forgejo
  # les produit lui-même au premier démarrage et les garde dans
  # data/gitea/conf/app.ini. Ne les renseigner que pour restaurer une base
  # existante sur un volume vide — auquel cas elles doivent être exactement
  # celles de l'app.ini d'origine, relevées AVANT la panne.
  #
  # secret_key est le seul dont la perte soit irréparable : il chiffre en base
  # les secrets TOTP et les identifiants des dépôts miroirs. Les trois autres
  # n'invalident que des sessions et des jetons, qui se réémettent.
  secret_key: ""
  internal_token: ""
  oauth2_jwt_secret: ""
  lfs_jwt_secret: ""
acme:
  # La variable attendue par acme.sh est DuckDNS_Token, en CamelCase.
  duckdns_token: ""
sonarqube:
  admin_password: ""
  db_password: ""
  ci_analysis_token: ""
