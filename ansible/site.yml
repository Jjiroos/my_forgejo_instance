# Point d'entrée : amène une machine nue à l'état « prête pour OpenTofu ».
#
# Ce playbook s'arrête là où une API commence. Tout ce qui se configure ensuite
# par API — ressources k3s, dépôts et secrets Forgejo, projets SonarQube —
# relève de tofu/, pas d'ici. Voir IAC.md pour la frontière exacte.
- name: Préparer l'hôte de la forge
  hosts: forge
  become: true

  roles: []
    # À implémenter, dans cet ordre de dépendance :
    # - common       paquets de base, sysctl, UFW, fail2ban
    # - cgroup_pi    cgroup_enable=memory dans cmdline.txt (Pi uniquement, reboot)
    # - docker       moteur + plugin compose
    # - acme         acme.sh + certificat DuckDNS en DNS-01
    # - nginx        vhosts forge et SonarQube
    # - forgejo      pile docker-compose + app.ini
    # - k3s          installation du cluster mono-nœud
