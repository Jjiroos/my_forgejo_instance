---
# Copier en `hosts.yml` (ignoré par git) et renseigner.
#
#   cp ansible/inventory/hosts.example.yml ansible/inventory/hosts.yml
#
# Deux cibles sont prévues et doivent rester interchangeables : c'est en
# rejouant le même rôle sur la VM amd64 qu'on vérifie qu'aucune valeur propre
# au Pi ne s'est glissée dans le code.
all:
  children:
    forge:
      hosts:
        piserv:
          ansible_host: <IP_LAN_DU_SERVEUR>
          ansible_user: <UTILISATEUR_SSH>
          # raspberry_pi | generic_amd64 | generic_arm64. Déclaré à la main
          # plutôt que déduit des faits : un arm64 générique a la même
          # architecture qu'un Pi sans en avoir l'amorçage, et c'est
          # précisément ce que le profil sert à distinguer.
          host_profile: raspberry_pi

          # Valeurs propres à l'installation — c'est pour elles que ce fichier
          # n'est pas versionné.
          forgejo_domain:       <SOUS_DOMAINE>.duckdns.org
          node_lan_ip:          <IP_LAN_DU_SERVEUR>
          admin_workstation_ip: <IP_DU_POSTE_ADMIN>
          acme_email:           <ADRESSE_DE_CONTACT>
          acme_duckdns_token:   "{{ lookup('community.sops', '../secrets/piserv.sops.yaml') | from_yaml | json_query('acme.duckdns_token') }}"

        vmtest:
          ansible_host: <IP_DE_LA_VM>
          ansible_user: <UTILISATEUR_SSH>
          host_profile: generic_amd64
