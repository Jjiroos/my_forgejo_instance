[defaults]
inventory            = inventory/hosts.yml
roles_path           = roles
host_key_checking    = True
# `stdout_callback = yaml` désignait le callback community.general.yaml, retiré
# de la collection depuis. Le callback intégré rend le même service et ne
# dépend de rien.
stdout_callback      = default
callback_result_format = yaml
callbacks_enabled    = ansible.posix.profile_tasks
interpreter_python   = auto_silent
# Les faits sont réutilisés d'un playbook à l'autre : sur un Pi, leur collecte
# coûte plusieurs secondes par hôte.
gathering            = smart
fact_caching         = jsonfile
fact_caching_connection = .ansible/facts
fact_caching_timeout = 3600

[ssh_connection]
pipelining = True
