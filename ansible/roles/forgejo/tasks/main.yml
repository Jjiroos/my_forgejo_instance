---
# Les valeurs absentes doivent arrêter le rôle ici, avec un message qui dit
# quoi faire. Un mot de passe vide produirait sinon une base PostgreSQL sans
# authentification et un échec bien plus loin, sans rapport apparent.
- name: Vérifier que les valeurs indispensables sont fournies
  ansible.builtin.assert:
    that:
      - forgejo_domain | default('') | length > 0
      - forgejo_db_password | length > 0
    fail_msg: >-
      forgejo_domain et forgejo_db_password sont obligatoires. Le mot de passe
      vient du fichier de secrets SOPS (clé forgejo.postgres_password), jamais
      du dépôt.
    quiet: true

# Fournir un compte d'administration à moitié est la façon la plus sûre de se
# retrouver avec une forge verrouillée et inaccessible.
- name: Vérifier la cohérence du compte d'administration
  ansible.builtin.assert:
    that: (forgejo_admin_username | length > 0) == (forgejo_admin_password | length > 0)
    fail_msg: >-
      forgejo_admin_username et forgejo_admin_password vont par paire. Avec
      forgejo_install_lock à true et aucun compte créé, l'instance démarre sans
      aucun accès possible.
    quiet: true

# ── Arborescence ──────────────────────────────────────────────
- name: Créer le répertoire de la pile
  ansible.builtin.file:
    path: "{{ forgejo_base_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# Les deux répertoires de données sont créés s'ils manquent, puis laissés
# tranquilles. Ce ne sont pas des fichiers de configuration : leur propriétaire
# appartient au conteneur qui les monte.
#
# PostgreSQL le montre sans ambiguïté. Un répertoire créé en root:root 0700
# ressort du premier démarrage appartenant à l'uid 70, le compte postgres
# interne, sans équivalent sur l'hôte :
#
#   avant  : root:root      700
#   après  : UNKNOWN:root   700
#
# Le réaffirmer à chaque convergence produisait deux effets, l'un visible et
# l'autre pas : un `changed` perpétuel, et surtout une base rendue illisible
# par son propre serveur au redémarrage suivant.
- name: Relever l'état des répertoires de données
  ansible.builtin.stat:
    path: "{{ item.path }}"
  loop:
    - { path: "{{ forgejo_data_dir }}",    owner: "{{ forgejo_uid }}", group: "{{ forgejo_gid }}", mode: "0750" }
    - { path: "{{ forgejo_db_data_dir }}", owner: root, group: root, mode: "0700" }
  loop_control:
    label: "{{ item.path }}"
  register: forgejo_data_dirs
  changed_when: false

- name: Créer les répertoires de données manquants
  ansible.builtin.file:
    path: "{{ item.item.path }}"
    state: directory
    owner: "{{ item.item.owner }}"
    group: "{{ item.item.group }}"
    mode: "{{ item.item.mode }}"
  loop: "{{ forgejo_data_dirs.results | rejectattr('stat.exists') | list }}"
  loop_control:
    label: "{{ item.item.path }}"

# ── Configuration de la pile ──────────────────────────────────
- name: Déposer le fichier d'environnement
  ansible.builtin.template:
    src: env.j2
    dest: "{{ forgejo_base_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true      # le contenu du diff serait le mot de passe lui-même

- name: Déposer le docker-compose de la forge
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ forgejo_base_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"

# ── Démarrage ─────────────────────────────────────────────────
# `pull: missing` et non `always` : les images sont épinglées dans
# group_vars, une récupération systématique n'apporterait rien et ferait
# dépendre chaque convergence de la disponibilité du registre.
- name: Démarrer la pile
  community.docker.docker_compose_v2:
    project_src: "{{ forgejo_base_dir }}"
    state: present
    pull: missing
    remove_orphans: true
    wait: true
    wait_timeout: "{{ forgejo_wait_timeout }}"

# Le port ouvert ne prouve rien : docker le lie avant que l'application ne
# réponde. La première migration de base peut durer plusieurs minutes.
- name: Attendre que la forge réponde
  ansible.builtin.uri:
    url: "http://{{ forgejo_bind_address }}:{{ forgejo_http_port }}/api/healthz"
    status_code: [200, 503]
    return_content: true
  register: forgejo_health
  until: forgejo_health.status == 200
  retries: "{{ (forgejo_wait_timeout | int / 5) | int }}"
  delay: 5
  changed_when: false
  check_mode: false

# ── Compte d'administration ───────────────────────────────────
- name: Relever les comptes d'administration existants
  ansible.builtin.command:
    cmd: docker exec -u git forgejo forgejo admin user list --admin
  register: forgejo_admin_list
  changed_when: false
  check_mode: false
  when: forgejo_admin_username | length > 0

# Le mot de passe transite par la ligne de commande — c'est la seule interface
# qu'offre `forgejo admin user create`. Visible dans `ps` le temps de
# l'exécution, sur un hôte où seul root peut agir. `no_log` évite au moins
# qu'il ne finisse dans les journaux d'Ansible.
- name: Créer le compte d'administration
  ansible.builtin.command:
    cmd: >-
      docker exec -u git forgejo forgejo admin user create
      --admin
      --username {{ forgejo_admin_username | quote }}
      --password {{ forgejo_admin_password | quote }}
      --email {{ forgejo_admin_email | quote }}
      --must-change-password=false
  no_log: true
  changed_when: true
  when:
    - forgejo_admin_username | length > 0
    - forgejo_admin_username not in (forgejo_admin_list.stdout | default(''))

# ── fail2ban ──────────────────────────────────────────────────
# Une jail dont le logpath n'existe pas démarre quand même, et ne lit rien.
# Mieux vaut attendre le fichier que poser une protection qui n'en est pas une.
- name: Attendre le journal de la forge
  ansible.builtin.wait_for:
    path: "{{ forgejo_log_file }}"
    timeout: 60
  when: forgejo_fail2ban_enabled

- name: Déposer le filtre fail2ban de la forge
  ansible.builtin.template:
    src: fail2ban-filter.conf.j2
    dest: /etc/fail2ban/filter.d/forgejo.conf
    owner: root
    group: root
    mode: "0644"
  when: forgejo_fail2ban_enabled
  notify: Recharger fail2ban pour la forge

- name: Déposer la jail fail2ban de la forge
  ansible.builtin.template:
    src: fail2ban-jail.conf.j2
    dest: /etc/fail2ban/jail.d/10-forgejo.conf
    owner: root
    group: root
    mode: "0644"
  when: forgejo_fail2ban_enabled
  notify: Recharger fail2ban pour la forge
