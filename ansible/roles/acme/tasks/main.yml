---
# Deux façons d'obtenir les mêmes fichiers aux mêmes emplacements.
#
# `letsencrypt` est le mode réel : certificat publiquement reconnu, validé en
# DNS-01 sur DuckDNS, donc sans exiger le moindre port ouvert.
#
# `selfsigned` existe pour la CI. Émettre un vrai certificat y demanderait le
# jeton DuckDNS d'un compte personnel, ce qui n'a pas sa place dans un dépôt
# public. Le mode auto-signé produit un certificat au même chemin, ce qui
# permet de tester le rôle nginx de bout en bout — un navigateur le refuserait,
# mais `nginx -t` et le service, eux, s'en satisfont.
- name: Vérifier que le mode est reconnu
  ansible.builtin.assert:
    that: acme_mode in ['letsencrypt', 'selfsigned']
    fail_msg: "acme_mode doit valoir 'letsencrypt' ou 'selfsigned' (reçu : {{ acme_mode }})."
    quiet: true

- name: Créer le répertoire des certificats
  ansible.builtin.file:
    path: "{{ acme_cert_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Certificats Let's Encrypt
  ansible.builtin.include_tasks: letsencrypt.yml
  when: acme_mode == 'letsencrypt'

- name: Certificats auto-signés (CI)
  ansible.builtin.include_tasks: selfsigned.yml
  when: acme_mode == 'selfsigned'
